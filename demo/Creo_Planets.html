<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BaseReal-OS · Genesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(7,13,24,.66);
  --glass2:rgba(9,16,30,.86);
  --line:rgba(120,200,255,.16);
  --line2:rgba(120,200,255,.34);
  --cyan:#62d8ff;
  --cyan2:#b4efff;
  --amber:#ffb84d;
  --amber2:#ffe0a8;
  --violet:#b99cff;
  --text:#e8f0fa;
  --mut:#8b9cb4;
  --dim:#5d6b80;
  --green:#7dffb8;
  --red:#ff7a7a;
  --ui:'Exo 2',system-ui,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{z-index:0}
#cv{z-index:1;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
#cv.place{cursor:crosshair}
#cv.hover{cursor:pointer}
#ui{position:fixed;inset:0;z-index:2;pointer-events:none}
.pe{pointer-events:auto}
.hidden{display:none!important}
.fade{transition:opacity .5s ease, transform .5s ease}
.off{opacity:0!important;pointer-events:none!important}

/* ---------- glass + buttons ---------- */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);box-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04)}
.btn{font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--text);background:rgba(10,20,36,.62);border:1px solid var(--line2);border-radius:999px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .2s,border-color .2s,box-shadow .2s,transform .12s,color .2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn:hover{background:rgba(40,90,140,.38);border-color:var(--cyan);box-shadow:0 0 18px rgba(98,216,255,.28)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn .ic{font-size:15px;line-height:1;opacity:.95}
.btn.icon{padding:0;width:38px;height:38px;justify-content:center;font-size:15px}
.btn.amber{border-color:rgba(255,184,77,.7);color:var(--amber2);background:rgba(60,34,6,.5)}
.btn.amber:hover{background:rgba(120,70,10,.55);border-color:var(--amber);box-shadow:0 0 26px rgba(255,184,77,.45)}
.btn.cyan{border-color:rgba(98,216,255,.75);color:var(--cyan2);background:rgba(6,40,60,.5)}
.btn.violet{border-color:rgba(185,156,255,.7);color:#e2d6ff;background:rgba(40,20,70,.5)}
.btn.violet:hover{background:rgba(70,40,120,.55);border-color:var(--violet);box-shadow:0 0 26px rgba(185,156,255,.4)}
.btn.big{font-size:15px;padding:13px 26px;letter-spacing:.12em;text-transform:uppercase}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.14);color:var(--mut)}
.btn.ghost:hover{color:var(--text);border-color:rgba(255,255,255,.35);box-shadow:none;background:rgba(255,255,255,.05)}
.btn[disabled]{opacity:.35;pointer-events:none}
@keyframes pulseA{0%,100%{box-shadow:0 0 14px rgba(255,184,77,.25),inset 0 0 10px rgba(255,184,77,.08)}50%{box-shadow:0 0 38px rgba(255,184,77,.75),0 0 70px rgba(255,140,40,.3),inset 0 0 18px rgba(255,184,77,.2)}}
@keyframes pulseC{0%,100%{box-shadow:0 0 14px rgba(98,216,255,.25),inset 0 0 10px rgba(98,216,255,.08)}50%{box-shadow:0 0 38px rgba(98,216,255,.75),0 0 70px rgba(60,160,255,.3),inset 0 0 18px rgba(98,216,255,.2)}}
@keyframes pulseV{0%,100%{box-shadow:0 0 14px rgba(185,156,255,.25)}50%{box-shadow:0 0 38px rgba(185,156,255,.75),0 0 70px rgba(140,100,255,.3)}}
.btn.amber.ready{animation:pulseA 1.5s ease-in-out infinite}
.btn.cyan.ready{animation:pulseC 1.5s ease-in-out infinite}
.btn.violet.ready{animation:pulseV 1.5s ease-in-out infinite}
.btn.press{transform:scale(.93);filter:brightness(1.4)}

/* ---------- top bars ---------- */
#topL{position:absolute;top:14px;left:14px;display:flex;gap:8px;align-items:center}
#topR{position:absolute;top:14px;right:14px;display:flex;gap:8px;align-items:center}
#btnHome{padding:9px 16px 9px 13px}
#btnHome .ic{font-size:17px}
#crumb{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center;max-width:42vw}
#crumb .l1{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#crumb .l2{font-size:16px;font-weight:600;letter-spacing:.08em;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 18px rgba(98,216,255,.35)}

/* ---------- toasts (hints) ---------- */
#toasts{position:absolute;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:min(520px,calc(100vw - 28px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:10px 14px 10px 12px;font-size:13px;line-height:1.45;color:#d9e6f5;opacity:0;transform:translateY(-8px);transition:opacity .45s,transform .45s;cursor:pointer;max-width:100%}
.toast.on{opacity:1;transform:none}
.toast .ti{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--cyan);color:var(--cyan);font:600 12px/18px var(--ui);text-align:center;margin-top:1px;box-shadow:0 0 10px rgba(98,216,255,.35)}
.toast b{color:var(--cyan2);font-weight:600}
.toast .f{font-family:var(--mono);font-size:12px;color:var(--amber2);white-space:nowrap}

/* ---------- caption (demo narration) ---------- */
#caption{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);width:min(680px,calc(100vw - 28px));text-align:center;opacity:0;transition:opacity .7s}
#caption.on{opacity:1}
#caption .ct{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px;text-shadow:0 0 12px rgba(98,216,255,.5)}
#caption .cx{font-size:17px;line-height:1.5;color:#eef4fb;text-shadow:0 2px 12px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9)}
#caption .cx .f{font-family:var(--mono);font-size:15px;color:var(--amber2)}
#bigword{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(22px,4vw,40px);font-weight:300;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,236,190,.95);text-shadow:0 0 30px rgba(255,180,80,.6);opacity:0;transition:opacity 1.2s;white-space:nowrap;padding-left:.5em}
#bigword.on{opacity:1}

/* ---------- bottom ---------- */
#bottom{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#bottom>*{flex:none}
#actions{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;flex:1 1 auto}
#timebar{display:flex;align-items:center;gap:10px;padding:8px 12px;min-width:250px}
#timebar .tl{display:flex;flex-direction:column;gap:2px;min-width:118px}
#timebar .t1{font:600 12px var(--mono);color:var(--text);white-space:nowrap}
#timebar .t2{font:11px var(--mono);color:var(--mut);white-space:nowrap}
#timebar input{width:110px}
#galbar{padding:9px 14px;font:12px/1.55 var(--mono);color:var(--mut);min-width:250px}
#galbar b{color:var(--text);font-weight:600}

/* ---------- info card ---------- */
#card{position:absolute;left:14px;bottom:14px;width:300px;padding:12px 14px 12px;max-height:calc(100vh - 150px);overflow:auto}
#card .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:default}
#card .sw{flex:none;width:28px;height:28px;border-radius:50%;box-shadow:0 0 14px currentColor}
#card .nm{font-size:16px;font-weight:600;letter-spacing:.04em;line-height:1.15}
#card .tp{font-size:11.5px;color:var(--mut);letter-spacing:.04em}
#card .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#card .acts .btn{font-size:12px;padding:7px 12px}
.rows{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:3px 10px;font-size:12px}
.rows .k{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .v{font-family:var(--mono);font-size:11.5px;color:var(--text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel,#card{overflow-x:hidden}
#card .rows .v{white-space:normal;overflow:visible}
#card .rows .k{white-space:normal}
sup{font-size:.7em;line-height:0}
#panel .sl{margin-bottom:9px}
#panel .preview{margin-bottom:8px}
.rows .v.hl{color:var(--amber2)}
.rows .v.ok{color:var(--green)}
.rows .v.bad{color:var(--red)}
.rows .sep{grid-column:1/3;height:1px;background:var(--line);margin:4px 0}
.season{margin-top:8px;padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12px;display:flex;gap:10px;align-items:center}
.season .si{font-size:18px}

/* ---------- config panel ---------- */
#panel{position:absolute;top:66px;right:14px;width:304px;max-height:calc(100% - 150px);overflow:auto;padding:14px 14px 12px}
#panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#panel .pt{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 10px rgba(98,216,255,.45)}
#panel.star .pt{color:var(--amber);text-shadow:0 0 10px rgba(255,184,77,.45)}
#panel.moon .pt{color:var(--violet);text-shadow:0 0 10px rgba(185,156,255,.45)}
#panel .pn{font-size:17px;font-weight:600;margin:3px 0 10px;letter-spacing:.03em}
.sl{margin:0 0 11px}
.sl .row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sl .lb{font-size:12.5px;color:#cfdbea;font-weight:500}
.sl .q{width:16px;height:16px;border-radius:50%;border:1px solid var(--dim);color:var(--mut);font:600 10px/14px var(--ui);text-align:center;cursor:help;flex:none}
.sl .q:hover{border-color:var(--cyan);color:var(--cyan)}
.sl .val{margin-left:auto;font:600 12px var(--mono);color:var(--text);white-space:nowrap}
.sl .sub{font:10.5px var(--mono);color:var(--mut);margin-top:3px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
.sl .sub span{overflow:hidden;text-overflow:ellipsis}
@media (min-width:601px){body.cfg #toasts{left:14px;transform:none;width:min(440px,calc(100vw - 340px));align-items:flex-start}}
.sl .sub span:last-child{color:var(--amber2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(98,216,255,.85),rgba(255,184,77,.75));box-shadow:0 0 8px rgba(98,216,255,.25)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(98,216,255,.85),rgba(255,184,77,.75))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fe8ff 45%,#1b84c4);border:1px solid rgba(180,239,255,.9);box-shadow:0 0 12px rgba(98,216,255,.8)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fe8ff 45%,#1b84c4);border:1px solid rgba(180,239,255,.9);box-shadow:0 0 12px rgba(98,216,255,.8)}
input.rev::-webkit-slider-runnable-track{background:linear-gradient(90deg,rgba(255,120,80,.9),rgba(98,216,255,.7))}
input.tilt::-webkit-slider-runnable-track{background:linear-gradient(90deg,rgba(150,170,200,.6),rgba(125,255,184,.8),rgba(255,184,77,.85),rgba(255,110,110,.9))}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:4px;border:1px solid rgba(255,255,255,.05)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3aa8ff,#a9f0ff,#fff);box-shadow:0 0 10px #62d8ff;transition:width .15s}
#panel .out{margin:10px 0 2px;padding:10px 0 0;border-top:1px solid var(--line)}
#panel .warn{margin-top:8px;font-size:12px;line-height:1.4;color:#ffc9a8;display:flex;gap:7px}
#panel .warn:empty{display:none}
#panel .pbtns{display:flex;gap:8px;margin-top:12px}
#panel .pbtns .btn{flex:1;justify-content:center}
.preview{display:flex;gap:10px;align-items:center;margin:2px 0 10px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.preview .pv{flex:none;width:34px;height:34px;border-radius:50%}
.preview .pvt{font-size:13px;font-weight:600;line-height:1.2}
.preview .pvs{font-size:11px;color:var(--mut);font-family:var(--mono);margin-top:2px}

/* ---------- title ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 0%,rgba(0,0,0,.35) 70%,rgba(0,0,0,.7) 100%);transition:opacity 1.2s}
#title .k1{font-size:12px;letter-spacing:.5em;color:var(--mut);text-transform:uppercase;padding-left:.5em}
#title h1{font-size:clamp(46px,10vw,108px);font-weight:200;letter-spacing:.32em;padding-left:.32em;margin:10px 0 4px;background:linear-gradient(180deg,#fff 10%,#ffe2aa 55%,#ff9d5c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(255,170,90,.35))}
#title .k2{font-size:clamp(14px,2vw,18px);color:#cfdcec;max-width:640px;line-height:1.55;margin-bottom:30px}
#title .k2 b{color:var(--cyan2);font-weight:600}
#title .tb{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#title .k3{margin-top:22px;font-size:12px;color:var(--dim);letter-spacing:.06em;line-height:1.6}

/* ---------- misc ---------- */
#skip{position:absolute;right:14px;top:62px}
@media (max-width:900px){#skip{top:108px}}
#cursor{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 16px rgba(98,216,255,.9),inset 0 0 10px rgba(98,216,255,.6);opacity:0;transition:opacity .4s, transform .15s;pointer-events:none!important;z-index:10}
#cursor::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
#cursor.on{opacity:1}
#cursor.down{transform:scale(.72);border-color:var(--amber);box-shadow:0 0 22px rgba(255,184,77,1)}
#tip{position:absolute;max-width:290px;padding:9px 12px;font-size:12.5px;line-height:1.45;color:#dbe7f5;opacity:0;transition:opacity .2s;pointer-events:none!important;z-index:20}
#tip.on{opacity:1}
#tip .f{font-family:var(--mono);color:var(--amber2);font-size:11.5px}
#help{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px;z-index:30}
#help .box{width:min(620px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px 22px;position:relative}
#help h2{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px;font-weight:600}
#help h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin:16px 0 8px;font-weight:600}
#help .fm{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:8px 16px;font-size:13px;line-height:1.45;align-items:baseline}
#help .fm .f{font-family:var(--mono);color:var(--amber2);font-size:12.5px;white-space:nowrap}
#help .fm span:not(.f){color:#cfdbea}
#help .x{position:absolute;top:12px;right:12px}
#help p{font-size:12.5px;color:var(--mut);line-height:1.5;margin-top:12px}
#placeLbl{position:absolute;padding:6px 10px;font:12px/1.4 var(--mono);color:var(--text);pointer-events:none!important;white-space:nowrap;opacity:0;transition:opacity .2s}
#placeLbl.on{opacity:1}
#placeLbl b{color:var(--amber2);font-weight:600}
#nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--mut);text-align:center;padding:30px}

@media (max-width:1000px){
  #card{top:112px;bottom:auto;width:272px;max-height:calc(100% - 200px);padding:10px 12px}
}
@media (max-width:900px){
  #crumb{top:62px;max-width:80vw}
  #crumb .l2{font-size:14px}
  #toasts{top:auto;bottom:74px;flex-direction:column-reverse}
  #card .nm{font-size:14.5px}
  .rows{font-size:11.5px}
  #panel{top:112px;width:270px;max-height:calc(100% - 128px);padding:12px}
  body.cfg #timebar{display:none!important}
  #timebar{min-width:0;padding:7px 10px}
  #timebar input{width:84px}
  #timebar .tl{min-width:96px}
  #galbar{min-width:0;font-size:11px}
  #caption{bottom:78px}
  #caption .cx{font-size:15px}
  .btn{font-size:12px;padding:8px 13px}
  .btn.big{font-size:13px;padding:11px 20px}
}
@media (max-width:600px){
  #card{width:min(250px,calc(100vw - 28px))}
  #panel{left:14px;right:14px;width:auto;top:auto;bottom:70px;max-height:46%}
  body.cfg #card{display:none}
  #timebar .tl .t2{display:none}
}

/* ---------- layout fixes after review ---------- */
#skip{top:auto;bottom:14px;right:14px} /* bottom right: the top row holds EN · RO · RU */
#galbar{position:absolute;left:14px;top:62px;min-width:0;width:auto;max-width:300px}
#card{width:320px;background:rgba(7,13,24,.86)}
.toast.glass{background:rgba(7,13,24,.86)}
#panel{width:320px;background:rgba(7,13,24,.84);overflow-x:hidden;overflow-y:auto}
#card{overflow-x:hidden;overflow-y:auto}
#panel .pbtns{position:sticky;bottom:-12px;margin:12px -12px -12px;padding:10px 12px 12px;background:linear-gradient(180deg,rgba(7,13,24,0),rgba(7,13,24,.95) 30%)}
#panel .rows .v{white-space:normal}
#caption{padding:10px 16px 12px;border-radius:14px;background:radial-gradient(ellipse at center,rgba(3,6,14,.62),rgba(3,6,14,.38) 70%,rgba(3,6,14,0));}
#bigword small{display:block;margin-top:14px;font-size:clamp(11px,1.3vw,14px);letter-spacing:.28em;color:rgba(200,215,240,.75);text-shadow:none}
/* demo player */
#player{position:absolute;top:62px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:999px;background:rgba(7,13,24,.8)}
#player .btn.icon{width:34px;height:34px;font-size:13px}
#player #pPlay{border-color:var(--cyan);color:var(--cyan2)}
#player .pinfo{min-width:160px;padding:0 6px;font:11px var(--mono);color:var(--mut);white-space:nowrap}
#player .pbar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:5px;overflow:hidden}
#player .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--amber));transition:width .4s}
#pauseOv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.16);opacity:0;pointer-events:none!important;transition:opacity .25s;cursor:pointer}
#pauseOv.on{opacity:1;pointer-events:auto!important}
#pauseOv .pi{font-size:64px;color:rgba(255,255,255,.85);text-shadow:0 0 30px rgba(98,216,255,.6);letter-spacing:-.1em}
#pauseOv .pt2{font-size:13px;color:#cfdbea;margin-top:10px;letter-spacing:.08em;text-shadow:0 1px 8px #000}
/* card: close + rename */
#card .cx{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--mut);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
#card .cx:hover{color:#fff;border-color:var(--cyan);box-shadow:0 0 10px rgba(98,216,255,.35)}
#card .hd{padding-right:30px}
#card .hn{min-width:0;flex:1}
#card .nm{display:flex;align-items:center;gap:6px}

<script>
'use strict';
/* =====================================================================
 * BaseReal-OS · GENESIS — сотворение звёзд, планет и лун в LT-системе
 * Тело задаётся двумя числами: радиус R и период T обращения у поверхности.
 * Поле: μ = 4π²R³/T². Орбита: P = 2π√(a³/μ) = T·(a/R)^{3/2}. Без G.
 * ===================================================================== */

/* ---------------- math utils ---------------- */
const PI = Math.PI, TAU = 2 * PI, K4 = 4 * PI * PI, DEG = PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const rand = (a = 0, b = 1) => a + (b - a) * Math.random();
const randi = (a, b) => Math.floor(rand(a, b + 1));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// vec3 as arrays
const v3 = (x = 0, y = 0, z = 0) => [x, y, z];
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vmul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = a => Math.hypot(a[0], a[1], a[2]);
const vnorm = a => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const vlerp = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

/* ---------------- value noise (seamless on sphere via 3D) ---------------- */
function ihash(x, y, z, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, z, s) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const a = ihash(xi, yi, zi, s), b = ihash(xi + 1, yi, zi, s), c = ihash(xi, yi + 1, zi, s), d = ihash(xi + 1, yi + 1, zi, s);
  const e = ihash(xi, yi, zi + 1, s), f = ihash(xi + 1, yi, zi + 1, s), g = ihash(xi, yi + 1, zi + 1, s), h = ihash(xi + 1, yi + 1, zi + 1, s);
  const x1 = a + (b - a) * u, x2 = c + (d - c) * u, x3 = e + (f - e) * u, x4 = g + (h - g) * u;

}
function fbm(x, y, z, s, oct = 5, lac = 2.03, gain = .5) {
  let sum = 0, amp = .5, norm = 0;
  for (let i = 0; i < oct; i++) { sum += amp * vnoise(x, y, z, s + i * 31); norm += amp; x *= lac; y *= lac; z *= lac; amp *= gain; }
  return sum / norm;
}
function ridged(x, y, z, s, oct = 4) {
  let sum = 0, amp = .5, norm = 0;
  for (let i = 0; i < oct; i++) { const n = 1 - Math.abs(vnoise(x, y, z, s + i * 17) * 2 - 1); sum += amp * n * n; norm += amp; x *= 2.1; y *= 2.1; z *= 2.1; amp *= .5; }
  return sum / norm;
}

/* ---------------- colour ---------------- */
function kelvinRGB(T) { // Tanner Helland approximation, slightly saturated for drama
  T = clamp(T, 1000, 40000) / 100; let r, g, b;
  if (T <= 66) { r = 255; g = 99.4708025861 * Math.log(T) - 161.1195681661; b = T <= 19 ? 0 : 138.5177312231 * Math.log(T - 10) - 305.0447927307; }
  else { r = 329.698727446 * Math.pow(T - 60, -0.1332047592); g = 288.1221695283 * Math.pow(T - 60, -0.0755148492); b = 255; }
  r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255);
  const m = (r + g + b) / 3, k = 1.35; // saturate a little

}
const rgbStr = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

/* =====================================================================
 *  LT physics
 * ===================================================================== */
const AU = 149597870.7, DAY = 86400, HOUR = 3600, YEAR = 365.25 * DAY;
const SUN = { R: 695700, T: 10008.225 };
const EARTH = { R: 6371.0, T: 5060.837 };
const muOf = (R, T) => K4 * R * R * R / (T * T);            // km³/s²  (L³T⁻²)
const MU_SUN = muOf(SUN.R, SUN.T), MU_EARTH = muOf(EARTH.R, EARTH.T);
const gSurf = (R, T) => K4 * R / (T * T) * 1000;            // m/s²
const orbPeriod = (a, mu) => TAU * Math.sqrt(a * a * a / mu);  // = T·(a/R)^{3/2}
const rotFromH = (T, h) => T * Math.pow(h, 1.5);             // сутки (звёздные) из высоты синхронной орбиты (в радиусах)
const hFromRot = (T, P) => Math.pow(P / T, 2 / 3);
const hillR = (a, mu, muC) => a * Math.cbrt(mu / (3 * muC));
function solarDay(Psid, Pyear, retro) {
  if (!isFinite(Pyear) || Pyear <= 0) return Psid;
  const inv = retro ? 1 / Psid + 1 / Pyear : 1 / Psid - 1 / Pyear;
  return Math.abs(inv) < 1e-14 ? Infinity : 1 / Math.abs(inv);
}
function starLum(M) { if (M < 0.43) return 0.23 * Math.pow(M, 2.3); if (M < 2) return Math.pow(M, 4); if (M < 55) return 1.4 * Math.pow(M, 3.5); return 32000 * M; }
function starPhys(R, T) {
  const Rs = R / SUN.R, mu = muOf(R, T), M = mu / MU_SUN, L = starLum(M);
  const Teff = 5772 * Math.pow(L / (Rs * Rs), .25);
  let cls, key;
  if (M < 0.075) { cls = 'BD'; key = 'st_bd'; }
  else if (Rs < 0.03) { cls = 'D'; key = 'st_wd'; }
  else if (Teff < 2300) { cls = Teff < 1300 ? 'T' : 'L'; key = Teff < 1300 ? 'st_T' : 'st_L'; } // too cold for a normal star
  else {
    const R_ = { O: [30000, 52000], B: [10000, 30000], A: [7500, 10000], F: [5950, 7500], G: [5300, 5950], K: [3900, 5300], M: [2300, 3900] };
    const letter = Teff >= 30000 ? 'O' : Teff >= 10000 ? 'B' : Teff >= 7500 ? 'A' : Teff >= 5950 ? 'F' : Teff >= 5300 ? 'G' : Teff >= 3900 ? 'K' : 'M';
    const [lo, hi] = R_[letter]; const sub = clamp(Math.floor(10 * (hi - Teff) / (hi - lo)), 0, 9);
    const Rms = M < 1 ? Math.pow(M, .8) : Math.pow(M, .57); // main-sequence radius for this mass
    const lc = Rs > 15 * Rms ? 'I' : Rs > 3 * Rms ? 'III' : 'V';
    cls = letter + sub + lc;
    const hue = Teff < 5200 ? 'r' : Teff > 9000 ? 'b' : 'y';
    if (lc === 'I') key = 'st_' + hue + 'sg';
    else if (lc === 'III') key = 'st_' + hue + 'g';
    else key = { O: 'st_O', B: 'st_B', A: 'st_A', F: 'st_F', G: 'st_G', K: 'st_K', M: 'st_M' }[letter];
  }

}
// температура на расстоянии d (а.е.) от звезды светимости L — калибровка «как у Земли с атмосферой»
const tempAt = (L, dAU) => 288 * Math.pow(Math.max(L, 1e-9), .25) / Math.sqrt(Math.max(dAU, 1e-4));
function planetType(Me, TK, inHZ) {
  if (Me >= 50) return TK > 1000 ? 'hotjup' : 'gas';
  if (Me >= 8) return TK > 300 ? 'subnep' : 'icegiant';
  if (inHZ && Me >= .1) return 'earthlike'; // habitable zone: liquid water with an atmosphere
  if (Me < 0.025) return TK > 750 ? 'lava' : TK < 170 ? 'icy' : 'airless';
  if (TK > 800) return 'lava';
  if (TK > 420) return Me > 0.3 ? 'venus' : 'airless';
  if (TK > 335) return 'desert';
  if (TK >= 255 || (TK >= 238 && Me >= .3)) return Me >= 0.08 ? 'earthlike' : 'airless';
  if (TK >= 175) return Me < 0.6 ? 'mars' : 'tundra';
  return 'icy';
}

/* ---------------- formatting ---------------- */
let LANG = 'en'; // every start is in English; EN · RO · RU buttons switch
const LOCALE = { en: 'en-US', ro: 'ro-RO', ru: 'ru-RU' };
function nf(v, d = 2) {
  if (!isFinite(v)) return '∞';
  return v.toLocaleString(LOCALE[LANG], { minimumFractionDigits: d, maximumFractionDigits: d });
}
function sig(v, n = 3) {
  if (!isFinite(v)) return '∞';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3) {
    const e = Math.floor(Math.log10(a)), m = v / Math.pow(10, e);
    return nf(m, n - 1) + '·10' + supNum(e);
  }
  const d = Math.max(0, n - 1 - Math.floor(Math.log10(a)));
  return nf(v, Math.min(d, 4));
}
function supNum(e) { const m = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' }; return String(e).split('').map(c => m[c] || c).join(''); }
function intf(v) { return Math.round(v).toLocaleString(LOCALE[LANG]); }
function fmtDur(s) { // seconds → human
  if (!isFinite(s)) return '∞';
  const a = Math.abs(s);
  if (a < 120) return sig(a, 3) + ' ' + t('u_s');
  if (a < 2 * HOUR) return sig(a / 60, 3) + ' ' + t('u_min');
  if (a < 2.5 * DAY) return sig(a / HOUR, 3) + ' ' + t('u_h');
  if (a < 1.5 * YEAR) return sig(a / DAY, 3) + ' ' + t('u_d');
  if (a < 1e6 * YEAR) return sig(a / YEAR, 3) + ' ' + t('u_y');
  if (a < 1e9 * YEAR) return sig(a / YEAR / 1e6, 3) + ' ' + t('u_my');

}

/* =====================================================================
 *  Sound — synthesized with WebAudio (starts after first click)
 * ===================================================================== */
const Snd = (() => {

    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }

/* ---------------- birth: long powerful discharge → implosion → flash → new body ---------------- */
const Birth = {
  active: null,

  },

      b.acc += dt * (16 + p * p * 150) * big;

        b.acc -= 1;

          const far = Math.max(W, H) * rand(.55, .85);

        }

        if (Math.random() < .08 + p * .2) Snd.zap(.5 + p * .6);

      setTimeout(() => FX.ring(q.x, q.y, [255, 255, 255], Math.max(W, H) * .55 * big, 1.4, 4), 120);

function nameOf(b) {

<span class="f">r_H = a·∛(μ/3μ★)</span><span>Sfera Hill: unde se poate menține o lună.</span>
<span class="f">înclinarea axei</span><span>Cauza anotimpurilor: emisfera spre stea — vară, dinspre stea — iarnă.</span>
<span class="f">v ≈ 220 km/s</span><span>Viteza stelelor în galaxie; o rotație durează ~230 mil. ani.</span></div>
<h3>Comenzi</h3><div class="fm">
<span class="f">mouse / deget</span><span>Rotirea vederii</span><span class="f">rotiță / ciupire</span><span>Zoom</span>
<span class="f">clic pe un corp</span><span>Selectare și apropiere</span><span class="f">dublu clic</span><span>Tot sistemul dintr-o privire</span>
<span class="f">trageți un inel</span><span>La configurare: albastru — orbita, portocaliu — orbita sincronă</span><span class="f">rotiți instrumentul</span><span>Prindeți-l de inel sau de coadă și rotiți — înclinarea axei</span><span class="f">nume</span><span>Câmpul „Nume” la creare sau ✎ Nume în fișă</span><span class="f">Esc · Spațiu</span><span>Anulare · pauză</span><span class="f">demo: atingere · glisare</span><span>Pauză · capitole înapoi/înainte (sau ⏮ ❚❚ ⏭, ← →)</span><span class="f">⟲</span><span>Privește demo-ul din nou</span></div>
<p>Dimensiunile corpurilor și distanțele de pe ecran sunt comprimate, ca să încapă totul. Perioadele orbitale, zilele și anotimpurile sunt reale. Sistemul Solar: R și T sunt calculate din razele și GM măsurate.</p>`
  }
};

/* ---------------- boot ---------------- */
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll('#langs [data-lang]').forEach(b => { const on = b.dataset.lang === LANG; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  $('tSub').innerHTML = t('title_sub'); $('tNote').innerHTML = t('title_note') + (S.systems.length ? '<br>' + t('title_saved', S.systems.length) : '');
  $('helpBox').innerHTML = t('help_html');
  $('toasts').innerHTML = ''; // old-language hints go away
  if (capKeys) { $('capT').innerHTML = t(capKeys[0]); $('capX').innerHTML = t(capKeys[1]); } // the demo narration just switches language
  if (PANEL.kind && !$('panel').classList.contains('hidden')) buildPanel(PANEL.kind);
  refreshUI();
}
let lastT = performance.now();
function frame(now) {
  const frozen = S.demo && S.dpause; // demo paused: the whole world holds its breath
  const rawDt = frozen ? 0 : Math.max(0, (now - lastT) / 1000), dt = Math.min(.05, rawDt) * (window.__ts || 1); lastT = now; // __ts: test fast-forward
  S.time += dt; S.humSet = false; TexQ.busy = 0;
  try {
    processDirector(dt);
    if (S.formAnim) { S.galForm = Math.min(1, S.galForm + dt * .45); if (S.galForm >= 1) { S.formAnim = false; refreshUI(); } }
    S.galT += Math.min(.25, rawDt) * (window.__ts || 1) * S.galRate; // galaxy clock is not slowed by low fps
    if (S.sys && S.scene === 'system' && !S.paused) { const dts = S.speed * dt; S.sys.t += dts; for (const b of allBodies(S.sys)) advanceSpin(b, dts, dt); }
    if (S.draft) advanceSpin(S.draft, S.speed * dt, dt);
    FX.update(dt);
    const sc = S.scene;
    if (GLR.ok) GLR.clear();
    if (sc === 'title' || sc === 'galaxy') drawGalaxyScene(dt);
    else if (sc === 'dive') drawDiveScene(dt);
    else if (sc === 'bh') drawBHScene(dt);
    else if (sc === 'void') { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); }
    else if (sc === 'forge') drawForgeScene(dt);
    else if (sc === 'system') drawSystemScene(dt);
    if (Birth.active) Birth.update(dt, cam, W, H);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (S.scene === 'forge' || S.scene === 'system') { shakeOn(); Birth.draw(ctx, cam); FX.draw(ctx); ctx.setTransform(1, 0, 0, 1, 0, 0); }
    FX.drawFlash(ctx, W, H);
    drawTrans(dt);
    if (!S.humSet && !(Birth.active && !Birth.active.flashed)) Snd.setHum(0, 1);
    if (S.scene === 'system') { renderCard(false); if (Math.floor(S.time * 4) !== Math.floor((S.time - dt) * 4)) updateTimebar(); }
    if (S.scene === 'galaxy') updateGalbar();
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
function boot() {
  resize(); window.addEventListener('resize', resize);
  if (!GLR.init()) setTimeout(() => toast(t('no_gl'), 14), 600);
  setGLScale();
  load();
  applyLang();
  gcam.dist = 48; gcam.pitch = 1.0; gcam.yaw = .3; S.galForm = 0; S.galRate = 12;
  $('btnStart').onclick = () => { Snd.init(); $('title').classList.add('off'); setTimeout(() => $('title').classList.add('hidden'), 1300); runDemo(); };
  $('btnFree').onclick = () => {
    Snd.init(); $('title').classList.add('off'); setTimeout(() => $('title').classList.add('hidden'), 1300);
    S.scene = 'galaxy'; S.galRate = 1; S.formAnim = true; gcam.dist = 32; gcam.pitch = .9; Snd.setDrone(.9); refreshUI(); setTimeout(() => hint('h_free'), 1600);
  };
  $('btnHome').onclick = () => { Snd.init(); goHome(); };
  $('btnGalaxy').onclick = () => { Snd.init(); goGalaxy(); };
  document.querySelectorAll('#langs [data-lang]').forEach(b => b.onclick = () => { if (b.dataset.lang !== LANG) { LANG = b.dataset.lang; applyLang(); } });
  $('btnSound').onclick = () => { Snd.init(); $('btnSound').textContent = Snd.toggle() ? '🔊' : '🔇'; };
  $('btnHelp').onclick = () => { $('help').classList.remove('hidden'); };
  $('help').onclick = e => { if (e.target.id === 'help' || e.target.closest('.x')) $('help').classList.add('hidden'); };
  $('btnCreate').onclick = () => { Snd.init(); if (PANEL.kind === 'star') ignite(); else createBody(); };
  $('btnCancel').onclick = () => cancelMode();
  $('skip').onclick = () => { if (S.demo) skipDemo(); else skipFlight(); };
  $('pPrev').onclick = () => demoPrev(); $('pPlay').onclick = () => demoPause(); $('pNext').onclick = () => demoNext(); $('pExit').onclick = () => skipDemo();
  $('pauseOv').onclick = () => demoPause(false);
  $('btnReplay').onclick = () => { Snd.init(); replayDemo(); };
  $('pNameIn').addEventListener('input', () => { S.pendingName = $('pNameIn').value; });
  $('pNameIn').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' || e.key === 'Escape') $('pNameIn').blur(); });
  $('btnPause').onclick = () => { S.paused = !S.paused; updateTimebar(); };
  const sp = $('spd'); sp.value = S.speedV;
  sp.oninput = () => { S.speedV = +sp.value; S.speed = SPEEDS[S.speedV]; S.speedPrev = null; updateTimebar(); }; // the user's choice wins
  sp.oninput();
  requestAnimationFrame(frame);
}
boot();

</script>
