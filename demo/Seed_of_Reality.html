<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseReal-OS // Seed of Reality</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green:   #00ff88;
            --red:     #ff3355;
            --cyan:    #00e5ff;
            --blue:    #0066ff;
            --bg:      #040404;
            --surface: #0a0a0a;
            --border:  #1a1a1a;
            --muted:   #444;
            --text:    #cccccc;
        }
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* ── TOP PANEL ─────────────────────────────────────── */
        .top-panel {
            flex: 1;
            position: relative;
            background: radial-gradient(ellipse at 50% 120%, #0c0c14 0%, var(--bg) 70%);
            border-bottom: 1px solid var(--border);
            min-height: 0;
        }
        .zone-label {
            position: absolute;
            top: 14px;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: uppercase;
        }
        .zone-label.past   { left: 24px; }
        .zone-label.future { right: 24px; }

        /* Timeline */
        .timeline {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--border);
        }

        /* Present line — runs full height */
        .present-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--cyan);
            box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(0,229,255,.2);
            z-index: 20;
        }

        /* PRESENT label sits at the seam between panels */
        .present-label {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            background: var(--bg);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            font-size: 10px;
            letter-spacing: 3px;
            padding: 5px 12px;
            white-space: nowrap;
            box-shadow: 0 0 16px rgba(0,229,255,.15);
        }

        /* Seeds */
        .seed {
            position: absolute;
            bottom: -10px;
            width: 20px;
            height: 20px;
            border-radius: 3px;
            z-index: 10;
            transform: translateX(-50%);
        }
        .seed.anon {
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
        }
        .seed.mine {
            background: var(--green);
            border: 1px solid rgba(255,255,255,.3);
            box-shadow: 0 0 20px rgba(0,255,136,.6);
            transition: background .2s, box-shadow .2s;
        }
        .seed.mine.blocked {
            background: var(--red);
            box-shadow: 0 0 20px rgba(255,51,85,.8);
            animation: blinkSeed .7s steps(1) infinite;
        }
        @keyframes blinkSeed {
            0%,49%  { opacity: 1; }
            50%,100%{ opacity: .2; }
        }

        /* HUD — anchored ABOVE the seed */
        .hud {
            position: absolute;
            bottom: 28px; /* gap above seed */
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            background: rgba(6,6,8,.97);
            border: 1px solid var(--green);
            border-radius: 6px;
            overflow: hidden;
            pointer-events: none;
            transition: border-color .2s;
        }
        .hud.blocked { border-color: var(--red); }
        .hud-row {
            padding: 8px 14px;
            border-bottom: 1px solid #111;
        }
        .hud-row:last-child { border-bottom: none; }
        .hud-key {
            font-size: 9px;
            letter-spacing: 2px;
            color: #444;
            margin-bottom: 3px;
            text-transform: uppercase;
        }
        .hud-val {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
        }
        .hud-val.ok  { color: var(--green); }
        .hud-val.err { color: var(--red);   }

        .grid-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            line-height: 1.6;
        }
        .grid-row span { color: #ddd; }

        /* Tether */
        .tether {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 4px;
            background: var(--green);
            transition: background .2s;
        }
        .tether.blocked { background: var(--red); }

        /* ── BOTTOM PANEL ──────────────────────────────────── */
        .bottom-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% -20%, #0c0c14 0%, var(--bg) 70%);
            position: relative;
            min-height: 0;
        }
        .radar-wrap {
            position: relative;
        }
        canvas#radar {
            display: block;
            border-radius: 50%;
        }
        .radar-status {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            letter-spacing: 2.5px;
            color: var(--cyan);
            white-space: nowrap;
            animation: fadePulse 3s ease-in-out infinite;
        }
        @keyframes fadePulse {
            0%,100%{ opacity: .3; }
            50%    { opacity: 1;  }
        }

        /* ── CONTROLS ──────────────────────────────────────── */
        .controls {
            position: fixed;
            bottom: 16px;
            right: 20px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }
        .btn {
            background: var(--surface);
            border: 1px solid var(--muted);
            color: var(--text);
            font-family: 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 3px;
            cursor: pointer;
            transition: border-color .2s, color .2s;
        }
        .btn:hover          { border-color: #888; color: #fff; }
        .btn.active         { border-color: var(--red); color: #ffaaaa; }
        .btn:focus-visible  { outline: 1px solid var(--cyan); outline-offset: 2px; }
    </style>
</head>
<body>

<!-- ── TOP ─────────────────────────────────────────────────── -->
<div class="top-panel" id="topPanel">
    <div class="zone-label past">← past</div>
    <div class="zone-label future">future →</div>

    <div class="present-line"></div>
    <div class="timeline"></div>
    <div id="seedTrack" style="position:absolute;width:100%;height:100%;top:0;left:0;">
        <!-- User seed + HUD stack -->
        <div id="mySeed" class="seed mine">
            <div id="tether"  class="tether"></div>
            <div id="hud"     class="hud">
                <div class="hud-row">
                    <div class="hud-key" id="kDesc">event</div>
                    <div class="hud-val" id="vDesc">Cyberpunk Bridge Meeting</div>
                </div>
                <div class="hud-row">
                    <div class="hud-key" id="kTimer">registry timer</div>
                    <div class="hud-val ok" id="vTimer">Syncing…</div>
                </div>
                <div class="hud-row" id="chargeRow" style="display:none">
                    <div class="hud-key">event charge</div>
                    <div class="hud-val ok" id="vCharge">0.62 / 1.00</div>
                </div>
                <div class="hud-row">
                    <div class="hud-key" id="kPos">relative position</div>
                    <div class="grid-row">DOWN <span id="gDown">0.0°</span></div>
                    <div class="grid-row">RIGHT<span id="gRight">0.0°</span></div>
                    <div class="grid-row">DIST <span id="gDist" style="color:var(--green)">0.0 m</span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- PRESENT label at seam -->
<div class="present-label">PRESENT TIME</div>

<!-- ── BOTTOM ──────────────────────────────────────────────── -->
<div class="bottom-panel">
    <div class="radar-wrap">
        <canvas id="radar" width="300" height="300"></canvas>
        <div class="radar-status" id="radarStatus">scanning horizon</div>
    </div>
</div>

<!-- ── CONTROLS (no overlap) ───────────────────────────────── -->
<div class="controls">
    <button class="btn" id="anomalyBtn" onclick="toggleAnomaly()">Anomaly Mode</button>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────
const CFG = {
    speed:          0.00115,
    eventAngleDeg:  52,
    eventPitchDeg:  10,
    maxDist:        250,
    pauseMs:        1000,
};

// ── STATE ─────────────────────────────────────────────────────
let tick = 0;
let appMode   = 'normal';   // 'normal' | 'anomaly'
let subMode   = 'approach'; // 'approach' | 'pause' | 'recede'
let progress  = 1.0;        // 1→0 approach, 0→−1 recede

let escProg   = 0;
let pauseStart = 0;

// Smooth gaze state — no snapping
let gazeYaw   = CFG.eventAngleDeg;
let gazePitch = CFG.eventPitchDeg;
let radarUserX, radarUserY; // set in first frame

// Anonymous seeds spread evenly
const anonPhases = [0.80, 0.55, 0.30, 0.05, -0.20, -0.50, -0.75];

// ── DOM ───────────────────────────────────────────────────────
const seedEl    = document.getElementById('mySeed');
const hudEl     = document.getElementById('hud');
const tetherEl  = document.getElementById('tether');
const anomBtn   = document.getElementById('anomalyBtn');
const vTimer    = document.getElementById('vTimer');
const vCharge   = document.getElementById('vCharge');
const chargeRow = document.getElementById('chargeRow');
const kTimer    = document.getElementById('kTimer');
const kPos      = document.getElementById('kPos');
const kDesc     = document.getElementById('kDesc');
const gDown     = document.getElementById('gDown');
const gRight    = document.getElementById('gRight');
const gDist     = document.getElementById('gDist');
const radarStatus = document.getElementById('radarStatus');
const canvas    = document.getElementById('radar');
const ctx       = canvas.getContext('2d');
const trackEl   = document.getElementById('seedTrack');

// Anonymous seed elements
const anonEls = anonPhases.map(() => {
    const el = document.createElement('div');
    el.className = 'seed anon';
    trackEl.appendChild(el);
    return el;
});

// ── HELPERS ───────────────────────────────────────────────────
function fmtTime(sec) {
    const a = Math.abs(sec);
    const pre = sec >= 0 ? 'Until collapse  ' : 'Archived  ';
    if (a < 0.05)  return 'COLLAPSE';
    if (a >= 1000) return `${pre}${(a/1000).toFixed(2)} ks`;
    if (a < 1)     return `${pre}${(a*1000).toFixed(0)} ms`;
    return `${pre}${a.toFixed(2)} s`;
}

function lerp(a, b, t) { return a + (b - a) * t; }

// ── MODE CONTROL ──────────────────────────────────────────────
function resetVisuals() {
    seedEl.classList.remove('blocked');
    hudEl.classList.remove('blocked');
    tetherEl.classList.remove('blocked');
    anomBtn.classList.remove('active');
    kDesc.textContent  = 'event';
    kTimer.textContent = 'registry timer';
    setHudOk();
}

function setHudOk() {
    vTimer.classList.add('ok'); vTimer.classList.remove('err');
    vCharge.classList.add('ok'); vCharge.classList.remove('err');
}

function setHudErr() {
    vTimer.classList.add('err'); vTimer.classList.remove('ok');
    vCharge.classList.add('err'); vCharge.classList.remove('ok');
}

function toggleAnomaly() {
    if (appMode === 'normal') {
        appMode = 'anomaly';
        subMode = 'approach';
        progress = 1.0; escProg = 0;
        resetVisuals();
        chargeRow.style.display = '';
        kPos.textContent = 'relative position';
        anomBtn.textContent = 'Anomaly: on';
        anomBtn.classList.add('active');
        radarStatus.textContent = 'scanning horizon';
    } else {
        appMode = 'normal';
        subMode = 'approach';
        progress = 1.0; escProg = 0;
        resetVisuals();
        chargeRow.style.display = 'none';
        kPos.textContent = 'relative position';
        anomBtn.textContent = 'Anomaly Mode';
        radarStatus.textContent = 'scanning horizon';
    }
}

function enterPause() {
    subMode = 'pause';
    progress = 0;
    pauseStart = performance.now();
    seedEl.classList.add('blocked');
    hudEl.classList.add('blocked');
    tetherEl.classList.add('blocked');
    anomBtn.classList.add('active'); // stays red
    kDesc.textContent  = 'event ⚠';
    kTimer.textContent = 'registry status';
    setHudErr();
    radarStatus.textContent = 'event pending — processing blocked';
}

function enterRecede() {
    subMode = 'recede';
    escProg = 0;
    radarStatus.textContent = 'event missed — drifting to archive';
}

function resetCycle() {
    subMode = 'approach';
    progress = 1.0; escProg = 0;
    resetVisuals();
    chargeRow.style.display = appMode === 'anomaly' ? '' : 'none';
    kPos.textContent = 'relative position';
    anomBtn.textContent = appMode === 'anomaly' ? 'Anomaly: on' : 'Anomaly Mode';
    if (appMode === 'anomaly') anomBtn.classList.add('active');
    radarStatus.textContent = 'scanning horizon';
}

// ── MAIN LOOP ─────────────────────────────────────────────────
function loop() {
    tick++;
    const W = window.innerWidth;
    const cX = W / 2;

    // ── Radar geometry ────────────────────────────────────────
    const R  = canvas.width / 2 - 10;
    const cx = canvas.width  / 2;
    const cy = canvas.height / 2;
    const evtAngle = CFG.eventAngleDeg * Math.PI / 180;
    const evtX = cx + Math.cos(evtAngle) * R * 0.52;
    const evtY = cy + Math.sin(evtAngle) * R * 0.52;

    // ── Progress update ───────────────────────────────────────
    if (appMode === 'anomaly') {
        if (subMode === 'approach') {
            progress -= CFG.speed;
            if (progress <= 0) { progress = 0; enterPause(); }
        } else if (subMode === 'pause') {
            if (performance.now() - pauseStart >= CFG.pauseMs) enterRecede();
        } else { // recede
            escProg -= CFG.speed;
            if (escProg <= -1.0) resetCycle();
        }
    } else {
        progress -= CFG.speed;
        if (progress < -1.05) progress = 1.05;
    }

    // ── Blocked? ──────────────────────────────────────────────
    const blocked = subMode === 'pause' || subMode === 'recede';

    // ── Seed X on top track ───────────────────────────────────
    const seedX = cX + progress * cX;
    seedEl.style.left = `${seedX}px`;

    // ── HUD timer ─────────────────────────────────────────────
    if (blocked) {
        vTimer.textContent = 'COLLAPSE';
        vCharge.textContent = '1.42 / 1.00  MAX';
        gDown.textContent  = '0.0°';
        gRight.textContent = '0.0°';
        gDist.textContent  = '0.0 m';
    } else {
        vTimer.textContent  = fmtTime(progress * 200);
        vCharge.textContent = '0.62 / 1.00';
        setHudOk();
    }

    // ── Smooth gaze — organic saccade pattern ─────────────────
    // Horizontal: slowly drifts between two targets (event and slightly off)
    // Vertical:   gentle breathing oscillation
    // Both update at different frequencies for natural feel
    const t = tick * 0.008;
    const targetYaw   = CFG.eventAngleDeg
        + Math.sin(t * 0.7) * 18      // slow broad sweep
        + Math.sin(t * 2.3) * 5       // quick glance
        + Math.sin(t * 0.19) * 8;     // long drift
    const targetPitch = CFG.eventPitchDeg
        + Math.sin(t * 1.1) * 4       // vertical sway
        + Math.cos(t * 0.4) * 2;      // slow nod

    // Smooth follow with different lag per axis
    gazeYaw   = lerp(gazeYaw,   targetYaw,   0.025);
    gazePitch = lerp(gazePitch, targetPitch, 0.018);

    // ── Radar user position ───────────────────────────────────
    const radarProg = subMode === 'recede' ? escProg : progress;
    let ux, uy;
    if (radarProg > 0) {
        const ratio = 1.0 - radarProg;
        ux = cx + (evtX - cx) * ratio;
        uy = cy + (evtY - cy) * ratio;
    } else if (radarProg === 0) {
        ux = evtX; uy = evtY;
    } else {
        const ratio = -radarProg * 0.6;
        ux = evtX + (evtX - cx) * ratio;
        uy = evtY + (evtY - cy) * ratio;
    }

    // Smooth radar user position
    if (radarUserX === undefined) { radarUserX = ux; radarUserY = uy; }
    radarUserX = lerp(radarUserX, ux, 0.06);
    radarUserY = lerp(radarUserY, uy, 0.06);

    // ── Bearing readout ───────────────────────────────────────
    if (!blocked) {
        const dx = evtX - radarUserX, dy = evtY - radarUserY;
        const pxDist = Math.sqrt(dx*dx + dy*dy);
        const maxPx  = R * 0.52;
        const realD  = (pxDist / maxPx) * CFG.maxDist;
        gDist.textContent  = realD < 0.5 ? '0.0 m' : `${realD.toFixed(1)} m`;

        let relR = (CFG.eventAngleDeg - gazeYaw + 360) % 360;
        let relD = (CFG.eventPitchDeg - gazePitch + 360) % 360;
        if (relR > 180) relR -= 360;
        if (relD > 180) relD -= 360;

        gDown.textContent  = `${relD.toFixed(1)}°`;
        gRight.textContent = `${relR.toFixed(1)}°`;
    }

    // ── Anonymous seeds ───────────────────────────────────────
    anonPhases.forEach((_, i) => {
        anonPhases[i] -= CFG.speed;
        if (anonPhases[i] < -1.05) anonPhases[i] = 1.05;
        anonEls[i].style.left = `${cX + anonPhases[i] * cX}px`;
    });

    // ── Draw radar ────────────────────────────────────────────
    drawRadar(cx, cy, R, evtX, evtY, blocked);

    requestAnimationFrame(loop);
}

function drawRadar(cx, cy, R, evtX, evtY, blocked) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid rings
    for (let i = 1; i <= 4; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, R * i / 4, 0, Math.PI * 2);
        ctx.strokeStyle = i === 4 ? '#1e1e1e' : '#131313';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    // Cross hairs
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.stroke();

    // Gaze cone
    const gazeRad = gazeYaw * Math.PI / 180;
    const fov     = 38 * Math.PI / 180;
    ctx.fillStyle = 'rgba(0,102,255,0.07)';
    ctx.beginPath();
    ctx.moveTo(radarUserX, radarUserY);
    ctx.arc(radarUserX, radarUserY, R * 0.85, gazeRad - fov/2, gazeRad + fov/2);
    ctx.closePath();
    ctx.fill();

    // Gaze line
    ctx.strokeStyle = 'rgba(0,102,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(radarUserX, radarUserY);
    ctx.lineTo(
        radarUserX + Math.cos(gazeRad) * R * 0.85,
        radarUserY + Math.sin(gazeRad) * R * 0.85
    );
    ctx.stroke();

    // Dashed line: user → event
    const dx = evtX - radarUserX, dy = evtY - radarUserY;
    const d  = Math.sqrt(dx*dx + dy*dy);
    if (d > 2) {
        ctx.save();
        ctx.setLineDash([3, 5]);
        ctx.strokeStyle = blocked
            ? 'rgba(255,51,85,.25)'
            : 'rgba(0,255,136,.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(radarUserX, radarUserY);
        ctx.lineTo(evtX, evtY);
        ctx.stroke();
        ctx.restore();
    }

    // Event node
    const evtCol = blocked ? '#ff3355' : '#00ff88';
    ctx.shadowBlur = 12; ctx.shadowColor = evtCol;
    ctx.fillStyle = evtCol;
    ctx.beginPath();
    ctx.arc(evtX, evtY, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Subtle label for event
    ctx.fillStyle = blocked ? 'rgba(255,51,85,.6)' : 'rgba(0,255,136,.5)';
    ctx.font = '9px Courier New';
    ctx.fillText('EVT', evtX + 11, evtY + 3);

    // User node
    ctx.shadowBlur = 8; ctx.shadowColor = '#fff';
    ctx.fillStyle  = '#fff';
    ctx.beginPath();
    ctx.arc(radarUserX, radarUserY, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0066ff';
    ctx.lineWidth   = 2;
    ctx.stroke();
    ctx.shadowBlur  = 0;

    // Blinking alert ring
    if (blocked && Math.floor(tick / 14) % 2 === 0) {
        ctx.beginPath();
        ctx.arc(radarUserX, radarUserY, 13, 0, Math.PI * 2);
        ctx.strokeStyle = '#ff3355';
        ctx.lineWidth   = 1.5;
        ctx.shadowBlur  = 8; ctx.shadowColor = '#ff3355';
        ctx.stroke();
        ctx.shadowBlur  = 0;
    }

    // Outer border
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
}

loop();
</script>
</body>
</html>
