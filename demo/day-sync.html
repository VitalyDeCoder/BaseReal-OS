<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BaseReal-OS · Day and Orbit</title>
<meta name="description" content="The length of the day sets the synchronous orbit: r = (t/T)^(2/3). Spin the planet faster until the equator becomes weightless.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(7,13,24,.66);
  --line:rgba(120,200,255,.16);
  --line2:rgba(120,200,255,.34);
  --cyan:#62d8ff;
  --cyan2:#b4efff;
  --amber:#ffb84d;
  --amber2:#ffe0a8;
  --text:#e8f0fa;
  --mut:#8b9cb4;
  --dim:#5d6b80;
  --ui:'Exo 2',system-ui,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:12px;
  --fc:70,170,255; /* the colour of the field: deep blue (weak) → bright light blue (strong); set by the script */
  --lc:90,175,255; /* the same colour for letters, lifted a little in a weak field so it stays readable on black */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{z-index:0}
#cv{z-index:1}
#ui{position:fixed;inset:0;z-index:2;pointer-events:none}
.pe{pointer-events:auto}
.fade{transition:opacity 1s ease}
.off{opacity:0!important;pointer-events:none!important}

/* ---------- glass + buttons (Genesis) ---------- */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);box-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04)}
.btn{font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--text);background:rgba(10,20,36,.62);border:1px solid var(--line2);border-radius:999px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .2s,border-color .2s,box-shadow .2s,transform .12s,color .2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn:hover{background:rgba(40,90,140,.38);border-color:var(--cyan);box-shadow:0 0 18px rgba(98,216,255,.28)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn .ic{font-size:15px;line-height:1;opacity:.95}
.btn.icon{padding:0;width:38px;height:38px;justify-content:center;font-size:15px}
.btn.amber{border-color:rgba(255,184,77,.7);color:var(--amber2);background:rgba(60,34,6,.5)}
.btn.amber:hover{background:rgba(120,70,10,.55);border-color:var(--amber);box-shadow:0 0 26px rgba(255,184,77,.45)}
.btn.cyan{border-color:rgba(98,216,255,.75);color:var(--cyan2);background:rgba(6,40,60,.5)}
.btn.big{font-size:15px;padding:13px 28px;letter-spacing:.12em;text-transform:uppercase}
@keyframes pulseC{0%,100%{box-shadow:0 0 14px rgba(98,216,255,.25),inset 0 0 10px rgba(98,216,255,.08)}50%{box-shadow:0 0 38px rgba(98,216,255,.75),0 0 70px rgba(60,160,255,.3),inset 0 0 18px rgba(98,216,255,.2)}}
.btn.cyan.ready{animation:pulseC 1.5s ease-in-out infinite}

/* ---------- top ---------- */
#topR{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;gap:8px;align-items:center;z-index:5}
#crumb{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center;max-width:42vw}
#crumb .l1{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
#crumb .l2{font-size:16px;font-weight:600;letter-spacing:.08em;color:var(--text);margin-top:2px;white-space:nowrap;text-shadow:0 0 18px rgba(98,216,255,.35)}
#langs{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(10,20,36,.62);border:1px solid var(--line2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#langs button{font:600 11.5px var(--ui);letter-spacing:.08em;color:var(--mut);background:transparent;border:1px solid transparent;border-radius:999px;min-width:32px;height:30px;padding:0 7px;cursor:pointer;transition:color .2s,background .2s,border-color .2s,box-shadow .2s}
#langs button:hover{color:var(--text);background:rgba(98,216,255,.1)}
#langs button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
#langs button.on{color:var(--cyan2);background:rgba(98,216,255,.18);border-color:rgba(98,216,255,.6);box-shadow:0 0 12px rgba(98,216,255,.35)}
#btnFS svg{display:block}
#btnFS.on{border-color:var(--cyan);color:var(--cyan2);box-shadow:0 0 14px rgba(98,216,255,.35)}

/* ---------- the friendly formula: r̃ = (t/T)^{2/3} — sizes, not numbers ---------- */
#formula{position:absolute;left:clamp(18px,3.4vw,64px);top:max(84px,16vh);font-family:var(--mono);--oc:255,184,77;--wc:255,226,170;--tc:98,216,255}
#formula::before{content:'';position:absolute;inset:-34% -30% -30% -50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),rgba(0,0,0,0));z-index:-1;pointer-events:none}
#formula .ft{font:600 clamp(11px,1.02vw,14px)/1.2 var(--ui);letter-spacing:.34em;text-transform:uppercase;color:var(--amber);text-shadow:0 0 12px rgba(255,184,77,.5);margin-bottom:.5em;padding-left:.1em;white-space:nowrap}
#formula .fx{display:flex;align-items:center;font-size:clamp(26px,min(3.7vw,6.8vh),68px);line-height:1}
.slot{position:relative;display:inline-block;flex:none}
.sH{width:1.25em;height:2.2em}
.sTt{width:1.6em;height:2.35em}
.sTT{width:1.4em;height:1.1em}
.L{position:absolute;font-style:italic;font-weight:500;white-space:nowrap;line-height:1;--s:1;--g:1;--c:var(--oc);color:rgb(var(--c));
  text-shadow:0 0 calc(var(--g)*.1em) rgba(var(--c),.95),0 0 calc(var(--g)*.32em) rgba(var(--c),.5),0 0 calc(var(--g)*.8em) rgba(var(--c),.22);will-change:transform}
.sH .L{right:0;top:50%;transform:translateY(-50%) scale(var(--s));transform-origin:100% 50%}
.sTt .L{left:50%;bottom:.02em;transform:translateX(-50%) scale(var(--s));transform-origin:50% 100%}
.sTT .L{left:50%;top:.04em;transform:translateX(-50%) scale(var(--s));transform-origin:50% 0}
#fT{--c:var(--tc)}
.tl{position:relative;display:inline-block}
.tl::before{content:'~';position:absolute;left:50%;top:-.5em;transform:translateX(-42%);font-size:.85em;font-style:normal;font-weight:400}
.eq{font-weight:300;font-size:.8em;color:rgba(220,232,248,.82);margin:0 .28em 0 .16em}
.par{font-weight:200;font-size:2.4em;line-height:.9;color:rgba(220,232,248,.42);margin:0 -.04em;position:relative;top:-.02em}
.frac{display:inline-flex;flex-direction:column;align-items:center}
.bar{align-self:stretch;height:max(2px,.045em);margin:.04em 0;border-radius:2px;background:linear-gradient(90deg,rgba(var(--wc),.3),rgba(255,240,215,.95) 50%,rgba(var(--tc),.45));box-shadow:0 0 .18em rgba(var(--oc),.5)}
.pw{align-self:flex-start;font-size:.52em;font-weight:400;color:rgba(232,240,250,.92);margin-top:.15em;white-space:nowrap;letter-spacing:.02em}
#formula .lg{margin-top:1em;font:400 clamp(13px,1.05vw,16px)/1.5 var(--ui);color:#b4c2d4;letter-spacing:.02em;max-width:27em}
#formula .lg span{display:block;margin-top:.15em}
#formula .lg i,#formula .lgs i{font-family:var(--mono);font-style:italic;font-weight:600;color:var(--amber2)}
#formula .lg i.c,#formula .lgs i.c{color:var(--cyan2)}

/* ---------- one vertical slider: the length of the day t ---------- */
#slider{position:absolute;right:max(16px,env(safe-area-inset-right));top:50%;transform:translateY(-44%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 14px 14px}
.vs{display:flex;flex-direction:column;align-items:center;gap:6px;outline:none;width:82px;touch-action:none;cursor:grab}
.vs.drag{cursor:grabbing}
.vs .vl{font:italic 600 34px/1 var(--mono);color:var(--amber2);text-shadow:0 0 12px rgba(255,190,100,.75),0 0 28px rgba(255,170,80,.3)}
.vs .vw{font:600 10.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.vs .tr{position:relative;width:64px;height:clamp(200px,48vh,460px);margin:12px 0 14px}
.vs .rail{position:absolute;left:0;right:0;top:15px;bottom:15px}
.vs .wedge{position:absolute;left:50%;top:-15px;bottom:-15px;width:20px;transform:translateX(-50%);clip-path:polygon(0 0,100% 0,61% 100%,39% 100%);opacity:.85;background:linear-gradient(0deg,rgb(255,244,214),rgb(255,190,96) 30%,rgb(190,120,60) 70%,rgb(120,80,50))}
.vs .pm{position:absolute;left:50%;transform:translate(-50%,-50%);font:500 10.5px/1 var(--ui);letter-spacing:.06em;color:#9fb0c6;pointer-events:none;white-space:nowrap}
.vs .pm.p{top:-25px} .vs .pm.m{bottom:-38px}
.vs .mk{position:absolute;left:50%;width:30px;height:2px;margin:-1px 0 0 -15px;background:rgba(255,255,255,.6);border-radius:1px;box-shadow:0 0 6px rgba(255,255,255,.4);pointer-events:none}
.vs .mk span{position:absolute;right:calc(100% + 3px);top:50%;transform:translateY(-52%);font:500 12px var(--mono);color:rgba(210,225,245,.78)}
.vs .mk.t0 span{font-style:italic;font-weight:600;color:var(--cyan2)}
.vs .th{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,rgb(255,200,120) 52%,rgba(255,170,80,.6));border:1px solid rgba(255,255,255,.85);box-shadow:0 0 16px rgba(255,190,100,.9),0 0 36px rgba(255,170,80,.4);pointer-events:none}
.vs:focus-visible .th{outline:2px solid #fff;outline-offset:3px}
#btnReset{font-size:12px;padding:7px 13px}
#btnReset .ic{font-size:14px}

/* ---------- the notice: weightless at the equator ---------- */
#toast{position:absolute;left:50%;top:max(66px,9vh);display:flex;gap:12px;align-items:center;padding:12px 20px 12px 14px;opacity:0;transform:translate(-50%,-10px);transition:opacity .5s,transform .5s;pointer-events:none;z-index:6;border-color:rgba(255,226,170,.5);background:rgba(10,14,24,.84);width:max-content;max-width:calc(100vw - 24px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .ti{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,226,170,.85);display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);color:#ffe2b0;box-shadow:0 0 16px rgba(255,200,120,.5)}
#toast .t1{font:600 17px/1.2 var(--ui);color:#fff3dc;letter-spacing:.03em}
#toast .t2{font:400 12.5px/1.35 var(--ui);color:#b9c6d8;margin-top:3px}
#hint{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:14px;letter-spacing:.05em;color:#dbe7f5;padding:9px 18px;border-radius:999px;background:rgba(7,13,24,.62);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;transition:opacity .8s}
#hint b{color:var(--amber2);font-family:var(--mono);font-style:italic}

/* ---------- title ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(0,0,0,.5) 0%,rgba(0,0,0,.62) 60%,rgba(0,0,0,.8) 100%);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity 1.2s;z-index:4}
#title .k1{font-size:12px;letter-spacing:.5em;color:var(--mut);text-transform:uppercase;padding-left:.5em}
#title h1{font-size:clamp(30px,6.2vw,78px);font-weight:200;letter-spacing:.24em;padding-left:.24em;margin:14px 0 10px;text-transform:uppercase;background:linear-gradient(180deg,#fff 12%,#ffe6b8 52%,#ffb84d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(255,180,80,.38))}
#title .k2{font-size:clamp(14px,1.9vw,18px);color:#cfdcec;max-width:660px;line-height:1.6;margin-bottom:30px}
#title .k2 b{color:var(--amber2);font-weight:600}
#title .k3{margin-top:22px;font-size:12px;color:var(--dim);letter-spacing:.06em}

/* ---------- phones and narrow windows ---------- */
body.portrait #crumb{display:none}
body.portrait #formula{left:12px;right:12px;top:max(62px,8vh);text-align:center}
body.portrait #formula .ft{font-size:11px;letter-spacing:.26em}
body.portrait #formula .fx{font-size:clamp(24px,8.2vw,52px);justify-content:center}
body.portrait #formula .lg{display:none}
#formula .lgs{display:none}
body.portrait #formula .lgs{display:block;margin-top:.7em;font:400 11.5px/1.4 var(--ui);color:var(--mut)}
body.portrait #slider{top:auto;transform:none;bottom:max(10px,env(safe-area-inset-bottom));right:max(8px,env(safe-area-inset-right));padding:10px 8px;gap:8px}
body.portrait .vs{width:66px;gap:4px}
body.portrait .vs .vl{font-size:28px}
body.portrait .vs .tr{height:clamp(130px,27vh,260px)}
body.portrait #btnReset span:not(.ic){display:none}
body.portrait #btnReset{padding:7px 10px}
body.portrait #hint{bottom:auto;font-size:13px}
body.portrait #toast{padding:10px 14px 10px 12px}
body.portrait #toast .t1{font-size:15px}
@media (max-height:520px){
  #formula{top:58px}
  #formula .lg{display:none}
  #slider{padding:8px 10px;gap:6px;top:60px;transform:none}
  .vs .vl{font-size:24px}
  .vs .tr{height:clamp(100px,calc(100vh - 236px),300px)}
  #crumb{display:none}
}
@media (max-width:600px){
  #langs{position:relative;z-index:60}
  #langs button{min-width:36px;padding:0 6px}
  #langs:not(.open) button:not(.on){display:none}
  #langs.open{flex-direction:column;align-items:stretch;gap:3px}
  #langs.open button{height:34px;background:rgba(10,20,36,.96);border-color:var(--line2)}
  #topR{gap:6px}
  #topR .btn.icon{width:34px;height:34px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="crumb" class="fade off"><div class="l1" data-i="crumb1"></div><div class="l2" data-i="crumb2"></div></div>
  <div id="topR">
    <button id="btnHome" class="btn icon amber pe" aria-label="Back to the site" title="Back to the site"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8H2.5M7 3.2 2.2 8 7 12.8"/></svg></button>
    <div id="langs" class="pe" role="group" aria-label="Language"><button data-lang="en" lang="en" title="English">EN</button><button data-lang="de" lang="de" title="Deutsch">DE</button><button data-lang="es" lang="es" title="Español">ES</button><button data-lang="ro" lang="ro" title="Română">RO</button><button data-lang="uk" lang="uk" title="Українська">UA</button><button data-lang="ru" lang="ru" title="Русский">RU</button></div>
    <button id="btnSound" class="btn icon pe" aria-label="Sound">🔊</button>
    <button id="btnFS" class="btn icon pe" aria-label="Full screen"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
  </div>

  <div id="formula" class="fade off" aria-label="r = (t / T)^(2/3)">
    <div class="ft" data-i="ftitle"></div>
    <div class="fx">
      <span class="slot sH"><span class="L" id="fH"><span class="tl">r</span></span></span>
      <span class="eq">=</span>
      <span class="par">(</span>
      <span class="frac">
        <span class="slot sTt"><span class="L" id="ft">t</span></span>
        <span class="bar"></span>
        <span class="slot sTT"><span class="L" id="fT">T</span></span>
      </span>
      <span class="par">)</span>
      <span class="pw">2/3</span>
    </div>
    <div class="lg" data-i="legend"></div>
    <div class="lgs" data-i="legendS"></div>
  </div>

  <div id="slider" class="glass pe fade off">
    <div class="vs" id="sD" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="89">
      <div class="vl">t</div>
      <div class="tr"><div class="rail"><div class="wedge"></div><span class="pm p" data-i="longer"></span><span class="pm m" data-i="shorter"></span><div class="mk" id="mkE"><span>⊕</span></div><div class="mk t0" style="top:100%"><span>T</span></div><div class="th"></div></div></div>
      <div class="vw" data-i="sD"></div>
    </div>
    <button id="btnReset" class="btn pe"><span class="ic">⟲</span><span data-i="reset"></span></button>
  </div>

  <div id="toast" class="glass" role="status" aria-live="polite"><div class="ti">0g</div><div><div class="t1" data-i="toast1"></div><div class="t2" data-i="toast2"></div></div></div>
  <div id="hint" class="off" data-i="hint"></div>

  <div id="title" class="pe">
    <div class="k1" data-i="k1"></div>
    <h1 data-i="h1"></h1>
    <div class="k2" data-i="sub"></div>
    <button id="btnStart" class="btn cyan big ready pe"><span class="ic">▶</span><span data-i="start"></span></button>
    <div class="k3" data-i="note"></div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
 * BaseReal-OS · Сутки и орбита — синхронная орбита r̃ = (t/T)^{2/3} (LT-система, G = 1)
 * t — длина суток, T — период обращения у самой поверхности. При t = T синхронная орбита ложится
 * на поверхность: экватор движется с первой космической, на экваторе невесомость.
 * Небо, Земля, ключ 3/2, звук и эффекты — из «Радиус · Время» (код Genesis v4).
 * ===================================================================== */

/* ---------------- math utils ---------------- */
const PI = Math.PI, TAU = 2 * PI, DEG = PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const rand = (a = 0, b = 1) => a + (b - a) * Math.random();
const randi = (a, b) => Math.floor(rand(a, b + 1));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vmul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = a => Math.hypot(a[0], a[1], a[2]);
const vnorm = a => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

/* ---------------- value noise (seamless on the sphere via 3D) ---------------- */
function ihash(x, y, z, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, z, s) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);

 *  Step and render

  setTimeout(() => FX.ring(PC.x, PC.y, C_SYNC, PR * 3, 1, 4), 90);
  FX.flash = FX.flashPeak = S.reduce ? .12 : .38; FX.flashCol = [160, 220, 255]; FX.flashAt = { x: PC.x, y: PC.y };
  FX.shake = S.reduce ? 0 : 4;
  for (let i = 0; i < 70; i++) { const a = rand(0, TAU), v = rand(80, 520) * DPR; FX.spark(PC.x + Math.cos(a) * PR * 1.1, PC.y + Math.sin(a) * PR * .5, Math.cos(a) * v, Math.sin(a) * v * .45, mixc(C_TOOL, [255, 255, 255], Math.random() * .6), rand(.5, 1.4), rand(1, 2.4), .95); }

}
function showUI() {

}
function render() {

/* ---- DOM: the formula letters and the slider ---- */
const EL = { h: $('fH'), t: $('ft'), T: $('fT'), th: document.querySelector('#sD .th'), sD: $('sD'), rail: document.querySelector('#sD .rail') };
function updateDOM() {
  const z = S.zeroA, g = .7 + 1.4 * S.act + 1.2 * z;
  EL.h.style.setProperty('--s', S.spr.h.x.toFixed(4)); EL.h.style.setProperty('--g', g.toFixed(3));
  EL.t.style.setProperty('--s', S.spr.t.x.toFixed(4)); EL.t.style.setProperty('--g', g.toFixed(3));
  EL.T.style.setProperty('--g', (.7 + 1.2 * z).toFixed(3));
  // when the day comes down to T, the letter t takes the colour of T: they are the same time now
  const k = clamp((1.35 - S.x) / .35, 0, 1), c = mixc([255, 226, 170], [98, 216, 255], k);
  EL.t.style.setProperty('--c', `${c[0] | 0},${c[1] | 0},${c[2] | 0}`);
  EL.th.style.top = ((1 - S.p) * 100) + '%';
}
function ariaText(x) { const D = I18N[LANG]; return Math.abs(x / X_EARTH - 1) < .02 ? D.asEarth : D.xT.replace('{0}', x.toLocaleString(LANG, { maximumFractionDigits: 1 })); }
function setP(p, user) {
  p = clamp(p, 0, 1); const old = S.p; if (Math.abs(p - old) < 1e-7) return;
  if ((old - P_EARTH) * (p - P_EARTH) < 0) Snd.tick(); // a soft click when the day passes the Earth's
  S.p = p; S.act = 1;
  if (user) { S.tween = null; if (!S.moved) { S.moved = true; $('hint').classList.add('off'); } }
  EL.sD.setAttribute('aria-valuenow', Math.round(p * 100)); EL.sD.setAttribute('aria-valuetext', ariaText(xOfP(p)));
}
// The whole column takes the finger (the letter, the track, the word), so the thumb can be caught at either end.
// The value follows the finger; past an end it stops at once, and the first move back moves it back (no dead zone at the ends).
(function slider() {
  const vs = EL.sD; let drag = false, pid = null, off = 0;
  const raw = y => { const r = EL.rail.getBoundingClientRect(); return 1 - (y - r.top) / r.height; };
  vs.addEventListener('pointerdown', e => {
    if (drag) return; drag = true; pid = e.pointerId; vs.setPointerCapture(pid); vs.classList.add('drag'); vs.focus({ preventScroll: true }); Snd.init();
    const r = EL.rail.getBoundingClientRect(), v = raw(e.clientY), half = 22 / Math.max(1, r.height);
    off = Math.abs(v - S.p) < half ? S.p - v : 0; // caught by the thumb: no jump
    setP(v + off, true); e.preventDefault();
  });
  vs.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== pid) return;
    let v = raw(e.clientY) + off;
    if (v > 1) { off -= v - 1; v = 1; } else if (v < 0) { off -= v; v = 0; }
    setP(v, true);
  });
  const up = e => { if (e.pointerId !== pid) return; drag = false; pid = null; vs.classList.remove('drag'); };
  vs.addEventListener('pointerup', up); vs.addEventListener('pointercancel', up);
  vs.addEventListener('lostpointercapture', () => { drag = false; pid = null; vs.classList.remove('drag'); });
  vs.addEventListener('keydown', e => {
    const st = { ArrowUp: .02, ArrowRight: .02, ArrowDown: -.02, ArrowLeft: -.02, PageUp: .1, PageDown: -.1 }[e.key];
    if (st) { setP(S.p + st, true); e.preventDefault(); }
    else if (e.key === 'Home') { setP(0, true); e.preventDefault(); }
    else if (e.key === 'End') { setP(1, true); e.preventDefault(); }
  });
})();
$('btnReset').addEventListener('click', () => { Snd.init(); Snd.tick(); S.tween = { t: 0, dur: .9, p0: S.p }; });

let LANG = 'en';

  { const hb = document.getElementById('btnHome'); if (hb) { hb.title = HOME[LANG] || HOME.en; hb.setAttribute('aria-label', hb.title); } }
  document.querySelectorAll('[data-i]').forEach(el => { const v = D[el.dataset.i]; if (v != null) el.innerHTML = v; });
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  try { localStorage.setItem('dsLang', LANG); } catch (e) { }
  EL.sD.setAttribute('aria-label', D.aria); EL.sD.setAttribute('aria-valuetext', ariaText(S.x));

  box.classList.remove('open'); applyLang(b.dataset.lang); Snd.tick();
});

/* ---- the amber arrow of Genesis: back to the page of the site the visitor came from ---- */
const HOME = { en: 'Back to the site', de: 'Zurück zur Website', es: 'Volver al sitio', ro: 'Înapoi la site', uk: 'Назад на сайт', ru: 'Назад на сайт' };
function goHome() {
  let ref = null; try { ref = document.referrer ? new URL(document.referrer) : null; } catch (e) { }
  if (ref && /^https?:$/.test(ref.protocol) && ref.href.split('#')[0] !== location.href.split('#')[0]) {
    if (ref.origin === location.origin && history.length > 1) { history.back(); return; } // the site page comes back as it was left
    location.href = ref.href; return;
  }
  location.href = /(^|\.)basereal-os\.dev$/.test(location.hostname) ? location.origin + '/' : 'https://basereal-os.dev/'; // opened directly: the home page of the site
}
document.getElementById('btnHome').addEventListener('click', () => { Snd.tick(); goHome(); });

/* ---- sound, full screen, keys ---- */
$('btnSound').addEventListener('click', () => { Snd.init(); const on = Snd.toggle(); $('btnSound').textContent = on ? '🔊' : '🔇'; });
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFS() {
  const d = document.documentElement;
  try {
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const p = (d.requestFullscreen || d.webkitRequestFullscreen).call(d, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => { }); }
  } catch (err) { }
}
$('btnFS').addEventListener('click', toggleFS);
for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, () => $('btnFS').classList.toggle('on', !!fsEl()));
document.addEventListener('visibilitychange', () => Snd.sleep(document.hidden));
const RM = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
S.reduce = !!(RM && RM.matches); if (RM && RM.addEventListener) RM.addEventListener('change', e => { S.reduce = e.matches; });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('.vs') && /^(Arrow|Page|Home|End)/.test(e.key)) return; // the slider keeps its own keys only
  if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') toggleFS();
  else if (e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') $('btnSound').click();
});

/* ---- start ---- */
function start() {
  if (S.phase !== 'title') return;
  Snd.init(); Snd.setDrone(.55); Snd.whoosh(2.6, .55);
  $('title').classList.add('off'); $('title').inert = true;
  S.phase = 'intro'; S.introT = 0;
}
$('btnStart').addEventListener('click', start);
function skipIntro() { // #auto: straight into the live scene (screenshots, kiosks)
  $('title').classList.add('off'); $('title').style.transition = 'none'; $('title').inert = true;
  S.phase = 'live'; S.liveT = 3; S.keyA = 1; S.keyFly = 0; S.syncA = 1; S.uiOn = true; S.moved = true;
  ['formula', 'slider', 'crumb'].forEach(id => { $(id).style.transition = 'none'; $(id).classList.remove('off'); });
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  S.dt = dt; S.time += dt;
  step(dt); render(); updateDOM();
  if (S.texJob) { // the sharp Earth: a few milliseconds of each frame (more before the scene is live)
    const end = performance.now() + (S.phase === 'live' ? 5 : 14);
    while (performance.now() < end) { const r = S.texJob.next(); if (r.done) { EARTH_B.tex = r.value; S.texJob = null; S.texFullMs = Math.round(performance.now() - S.texT0); break; } }
  }
  requestAnimationFrame(frame);
}
function boot() {
  const hp = new URLSearchParams(location.hash.slice(1));
  let lang = hp.get('lang');
  if (!lang) { try { lang = localStorage.getItem('dsLang') || localStorage.getItem('rtLang'); } catch (e) { } }
  if (!lang) { const nl = (navigator.language || 'en').slice(0, 2).toLowerCase(); lang = I18N[nl] ? nl : nl === 'ua' ? 'uk' : 'en'; }
  applyLang(lang);
  GLR.init();
  const t0 = performance.now();
  EARTH_B.tex = genTex('earth', 777, 128);   // a quick Earth now; the sharp one (512×256) is made in the spare time of frames
  S.texMs = Math.round(performance.now() - t0);
  S.texJob = texRows('earth', 777, 512); S.texT0 = performance.now();
  const tp = parseFloat(hp.get('t')); if (isFinite(tp)) S.p = clamp(tp, 0, 1);
  derive(); S.hd = S.h; S.spr.h.x = Math.pow(S.h, K_SIZE); S.spr.t.x = Math.pow(S.x, K_SIZE);
  EL.sD.setAttribute('aria-valuenow', Math.round(S.p * 100));
  layout();
  if (hp.has('auto')) skipIntro();
  window.addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  requestAnimationFrame(frame);
}
boot();
