<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Улитка теории стимуляции — пошаговый рост с РАВНЫМИ ОБЪЁМАМИ (20 слоёв, без текста)</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #ffffff; 
            touch-action: none; 
        }
        canvas { display: block; }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://unpkg.com/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, group;
        let shells = [];
        let currentStep = 0;
        let growingArc = 0;
        let growthSpeed = 0.085;
        let completed = false;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 18, 35);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0xffffff, 1);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.85));
            const light = new THREE.PointLight(0xffffff, 1.4);
            light.position.set(25, 40, 20);
            scene.add(light);

            group = new THREE.Group();
            scene.add(group);

            // === 20 оболочек с РАВНЫМИ ОБЪЁМАМИ (V = 4π² у каждого) ===
            const numShells = 20;
            const baseColor = new THREE.Color(`hsl(195, 85%, 50%)`);

            for (let i = 0; i < numShells; i++) {
                const R = 2 + i * 0.25;
                const r = R * 0.5;
                const targetArc = 16 * Math.PI / Math.pow(R, 3); // равные объёмы

                const geometry = new THREE.TorusGeometry(R, r, 32, 100, 0.01);

                const emissiveIntensity = 0.85 - (i / (numShells - 1)) * 0.70;

                const material = new THREE.MeshPhysicalMaterial({
                    color: baseColor,
                    emissive: baseColor,
                    emissiveIntensity: emissiveIntensity,
                    transparent: true,
                    opacity: 0.92,
                    metalness: 0.65,
                    roughness: 0.25,
                    side: THREE.DoubleSide
                });

                const torus = new THREE.Mesh(geometry, material);
                torus.rotation.z = Math.PI / 2;
                torus.visible = false;
                group.add(torus);

                shells.push({ mesh: torus, targetArc: targetArc, R: R });
            }

            shells[0].mesh.visible = true;

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!completed) {
                const current = shells[currentStep];
                if (!current.mesh.visible) current.mesh.visible = true;

                growingArc += growthSpeed;

                if (growingArc >= current.targetArc) {
                    current.mesh.geometry.dispose();
                    current.mesh.geometry = new THREE.TorusGeometry(
                        current.R, current.R * 0.5, 32, 100, current.targetArc
                    );

                    currentStep++;
                    growingArc = 0;

                    if (currentStep >= shells.length) completed = true;
                } else {
                    current.mesh.geometry.dispose();
                    current.mesh.geometry = new THREE.TorusGeometry(
                        current.R, current.R * 0.5, 32, 100, Math.max(0.01, growingArc)
                    );
                }
            } else {
                // после завершения — красивое вращение всей улитки
                group.rotation.y += 0.0035;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
