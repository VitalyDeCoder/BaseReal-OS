<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Galaxy Booster 3D - English Edition</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #fff; font-family: sans-serif; }
        canvas { display: block; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(30, 30, 30, 0.9); padding: 20px; 
            border: 2px solid #555; border-radius: 15px; z-index: 100;
        }
        button { 
            background: #444; color: #fff; border: none; 
            padding: 30px 40px; margin: 10px 0; display: block; width: 100%; 
            font-size: 26px; font-weight: bold; border-radius: 10px;
            text-transform: uppercase; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #777; }
        .active { background: #0055ff; box-shadow: 0 0 20px #0055ff; }
    </style>
</head>
<body>

<div id="ui">
    <button onclick="setMode('spiral')" id="btn-spiral">SPIRAL GALAXY</button>
    <button onclick="setMode('sphere')" id="btn-sphere">SPHERICAL GALAXY</button>
</div>

<canvas id="cvs"></canvas>

<script>
const canvas = document.getElementById('cvs');
const ctx = canvas.getContext('2d');
let particles = [];
let mode = 'spiral';

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.onresize = resize;
resize();

function setMode(m) {
    mode = m;
    particles = [];
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + m).classList.add('active');
}
setMode('spiral');

class Star {
    constructor(x, y, angle, speed, type) {
        this.originX = x;
        this.originY = y;
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.speed = speed;
        this.radius = 0;
        this.type = type;
        this.life = 1;
        this.baseSize = Math.random() * 2 + 0.5;
        this.currentSize = this.baseSize;
        this.color = type === 'spiral' ? '150, 200, 255' : '255, 255, 255';
    }

    update() {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        if (this.type === 'spiral') {
            this.radius += this.speed;
            this.angle += 0.015;
            this.x = cx + Math.cos(this.angle) * this.radius;
            this.y = cy + Math.sin(this.angle) * this.radius;
            this.currentSize = this.baseSize;
        } else {
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            this.currentSize = this.baseSize;
        }

        this.life -= 0.003;
    }

    draw() {
        if (this.life <= 0) return;
        ctx.fillStyle = 'rgba(' + this.color + ', ' + this.life + ')';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.currentSize, 0, Math.PI * 2);
        ctx.fill();
    }
}

function spawn() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const jitter = () => (Math.random() - 0.5) * 50;

    if (mode === 'spiral') {
        const time = Date.now() * 0.003;
        [0, Math.PI].forEach(function(offset) {
            const a = time + offset;
            for (let i = 0; i < 3; i++) {
                particles.push(new Star(cx + jitter(), cy + jitter(), a, Math.random() * 2.5 + 1, 'spiral'));
            }
        });
    } else if (mode === 'sphere') {
        for (let i = 0; i < 4; i++) {
            particles.push(new Star(cx + jitter(), cy + jitter(), Math.random() * Math.PI * 2, Math.random() * 2.5, 'sphere'));
        }
    }
}

function loop() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    spawn();

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();

        if (particles[i].life <= 0 ||
            particles[i].x > canvas.width + 200 || particles[i].x < -200 ||
            particles[i].y > canvas.height + 200 || particles[i].y < -200) {
            particles.splice(i, 1);
        }
    }
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
