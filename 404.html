<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaseReal-OS · page moved</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05080f;color:#e9eef7;font:16px/1.5 "Segoe UI",system-ui,sans-serif;text-align:center;padding:24px}
a{color:#62d8ff}
p{color:#93a4bb}
</style>
<script>
// Works on both addresses: basereal-os.dev/… and vitalydecoder.github.io/BaseReal-OS/…
// Old demo addresses (cited on Zenodo and in older posts) lead to their current versions.
var ROOT = location.pathname.indexOf('/BaseReal-OS/') === 0 ? '/BaseReal-OS/' : '/';
(function () {
  var moved = {
    'Creo_Planets.html': 'genesis.html', 'Creo_Star.html': 'genesis.html',
    'galaxy_booster.html': 'galaxy-booster.html', 'speed.html': 'kepler-3-2-tool.html',
    'geometric-mass.html': 'kepler-3-2-tool.html'
  };
  var path = location.pathname, i = path.lastIndexOf('/demo/');
  if (i < 0) return;
  var name = path.slice(i + 6);
  location.replace(moved[name] ? ROOT + 'demo/' + moved[name] : ROOT);
})();
</script>
</head>
<body>
<div>
<h1>This page has moved</h1>
<p>BaseReal-OS was reorganised. Everything current is on the main page.</p>
<p><a id="home" href="/">Open BaseReal-OS</a></p>
</div>
<script>document.getElementById('home').href = ROOT;</script>
</body>
</html>
